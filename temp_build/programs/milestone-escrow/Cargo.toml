[package]
name = "milestone-escrow"
version = "0.1.0"
description = "ALWARD Milestone-Gated USDC Escrow Protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "milestone_escrow"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token"] }

[patch.crates-io]
block-buffer = { git = "https://github.com/RustCrypto/utils", tag = "block-buffer-v0.10.4" }
digest = { git = "https://github.com/RustCrypto/utils", tag = "digest-v0.10.7" }
